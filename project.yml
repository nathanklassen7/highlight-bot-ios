# XcodeGen spec for the Highlight Bot iOS app.
# Regenerate the project with: xcodegen generate
name: HighlightBot

options:
  bundleIdPrefix: com.nathanklassen
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

packages:
  HighlightCore:
    path: HighlightCore

# Project-level defaults; the target repeats the ones that matter.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  HighlightBot:
    type: application
    platform: iOS
    sources:
      # Covers App/, Capture/, Features/, Triggers/, Support/ and Resources/ (xcassets picked up automatically).
      - path: HighlightBot
        excludes:
          - "Resources/README.md"
    dependencies:
      - package: HighlightCore
    info:
      path: HighlightBot/Info.plist
      properties:
        CFBundleDisplayName: Highlight Bot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Highlight Bot records video continuously so you can save the last few seconds as a clip.
        NSMicrophoneUsageDescription: Highlight Bot records audio along with video for your clips.
        NSPhotoLibraryAddUsageDescription: Highlight Bot saves clips you choose to your Photos library.
        NSSpeechRecognitionUsageDescription: Highlight Bot listens for “Clip it” while recording so you can save a clip hands-free. Recognition runs on this device.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        # Launch screen: adaptive background color + centered logo from the asset catalog.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Apple Developer team used for automatic signing. Change here (not in Xcode) so
        # `xcodegen generate` keeps it.
        DEVELOPMENT_TEAM: WMYF388QWV
        # com.highlightbot.app is taken by another team (the old free Personal Team
        # auto-registered it), so the ID is namespaced under the developer instead.
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanklassen.highlightbot
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: HighlightBot/Info.plist
        SUPPORTS_MACCATALYST: false
        ENABLE_PREVIEWS: true
        OTHER_SWIFT_FLAGS: "$(inherited)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  HighlightBot:
    build:
      targets:
        HighlightBot: all
    run:
      # Run Release with no debugger attached so on-device capture timing matches a
      # TestFlight build. Switch to Debug in Xcode's scheme editor when you need LLDB.
      config: Release
      debugEnabled: false
    test:
      config: Debug
      targets:
        - package: HighlightCore/HighlightCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

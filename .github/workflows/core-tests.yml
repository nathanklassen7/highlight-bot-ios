name: HighlightCore tests

on:
  push:
  pull_request:

jobs:
  swift-test:
    name: swift build && swift test (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: HighlightCore
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
